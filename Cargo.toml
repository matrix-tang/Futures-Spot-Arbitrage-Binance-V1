[package]
name = "arbitrage"
version = "0.1.0"
edition = "2021"

[features]
rustls-tls = ["tokio-tungstenite/rustls-tls-webpki-roots", "reqwest/rustls-tls"]
native-tls = ["tokio-tungstenite/native-tls", "reqwest/native-tls"]
default = ["native-tls"]

[dependencies]
toml = "0.8.19"
anyhow = "1.0.80"
tokio-tungstenite = "0.23.1"
tokio = { version = "1", features = ["full"] }
redis = { version = "0.26.1", features = ["tokio-comp"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio-rustls", "mysql", "rust_decimal", "runtime-tokio-native-tls"] }
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.96"
serde_qs = "0.13.0"
serde_repr = "0.1"
lazy_static = "1.4.0"
chrono = "0.4.23"
futures = "0.3"
thiserror = "1.0"
reqwest = { version = "0.12.5", features = ["json"], default-features = false }
url = "2.5"
once_cell = "1.8.0"
env_logger = "0.11.5"
log = "0.4"
rust_decimal = { version = "1.18.0", features = ["serde-bincode"] }
hex = "0.4"
ring = "0.17"
boolinator = "2.4"
dashmap = "6.0.1"
rocksdb = { version = "0.22.0", features = ["multi-threaded-cf"] }
bincode = "1.3.3"
ta = "0.5.0"